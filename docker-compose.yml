services:

  open-webui:
    env_file: .env
    image: ghcr.io/open-webui/open-webui:ollama
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${DOCKER_EXTERNAL_PORT_OPENWEBUI}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /opt/ollama_data:/root/.ollama
      - /opt/openwebui_data:/app/backend/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 2
              capabilities: [gpu]

  mcp-openstack:
    env_file: .env
    image: mcp-server-openstack-ops
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.MCP-Server
    container_name: mcp-openstack
    ports:
      - "${DOCKER_EXTERNAL_PORT_MCP_SERVER}:8001" 
    volumes:
      - ./src:/app/src/
      - ./scripts:/app/scripts
      - ./configs/openstack/cacert.pem:/etc/ssl/certs/openstack-ca.pem:ro
      - .env:/app/.env:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8001 && sleep 5"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s


  mcp-proxy:
    env_file: .env
    image: ghcr.io/open-webui/mcpo:main
    build: 
      context: .
      dockerfile: ./docker/Dockerfile.MCPO-Proxy
    container_name: mcp-proxy
    restart: unless-stopped
    depends_on:
      mcp-openstack:
        condition: service_healthy
    ports:
       - "${DOCKER_EXTERNAL_PORT_MCPO_PROXY}:8000"
    volumes:
      - ./configs/mcpo_data:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["mcpo", "--host", "0.0.0.0", "--port", "8000", "--config", "/app/config/mcp-config.json", "--hot-reload"]


  mcp-inspector:
    image: ghcr.io/modelcontextprotocol/inspector:latest
    container_name: mcp-inspector
    ports:
      - "6274:6274"
      - "6277:6277"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOST=0.0.0.0
      - ALLOWED_ORIGINS=http://127.0.0.1:6274,http://127.0.0.1:8001
      - CLIENT_PORT=6274
      - SERVER_PORT=6277
      - MCP_AUTO_OPEN_ENABLED=false
